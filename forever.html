<!DOCTYPE html>
<html>
<head>
<title>Forever & Always ❤️</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#ff4b7d,#ff9a9e);
    color:white;
    text-align:center;
    padding:80px 20px;
}
.card{
    background:rgba(255,255,255,0.2);
    padding:40px;
    border-radius:30px;
    max-width:520px;
    margin:auto;
    animation:fade 2s ease;
}
@keyframes fade{
    from{opacity:0; transform:scale(0.9);}
    to{opacity:1; transform:scale(1);}
}
</style>
</head>

<body>

<div class="card">
    <h1>Forever & Always 💖</h1>
    <p>
        Isha, you are my today, my tomorrow,  
        and my forever ❤️<br><br>
        This is just the beginning of our beautiful story 🌹
    </p>
    <h2>– Yours, Always 😘</h2>
</div>

</body>
</html>
